[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["routes/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".venv", ".uv-cache", ".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.coverage.run]
omit = ["routes/tests/*", "routes/migrations/*"]
